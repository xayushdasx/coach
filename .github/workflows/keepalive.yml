name: Keep alive

# Render's free plan sleeps after 15 idle minutes and then takes 20–50 s to wake.
# Pinging every 10 minutes keeps it awake; a failed run means the live app is down
# (GitHub emails the repo owner when a scheduled run fails).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Backend health
        run: curl -sf --retry 3 --retry-delay 20 --max-time 90 https://coach-api-jar5.onrender.com/health
      - name: Live site
        run: curl -sf --retry 3 --retry-delay 10 --max-time 60 -o /dev/null https://salescoach-ai-app.vercel.app/
